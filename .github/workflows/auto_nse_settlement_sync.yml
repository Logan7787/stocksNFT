name: NSE Daily 20:30 PM Settlement Auto-Sync

on:
  schedule:
    # 15:15 UTC = 20:45 IST (Mon-Fri) - 15 mins after 20:30 settlement
    - cron: '15 15 * * 1-5'
    # 15:45 UTC = 21:15 IST (Mon-Fri) - Retry
    - cron: '45 15 * * 1-5'
    # 16:30 UTC = 22:00 IST (Mon-Fri) - Final retry
    - cron: '30 16 * * 1-5'
  workflow_dispatch: # Allows one-click manual trigger from GitHub Actions tab anytime

permissions:
  contents: write

jobs:
  sync-settlement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch and Process NSE Official Settlement Bhavcopy
        run: |
          python scripts/sync_nse_settlement.py

      - name: Commit and Push Updated Settlement to Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/ src/data/
          if git diff --staged --quiet; then
            echo "No new settlement changes to commit."
          else
            git commit -m "Auto-sync NSE 20:30 PM settlement [automated]"
            git push origin main
          fi
